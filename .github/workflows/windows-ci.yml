name: Windows CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  QT_VERSION: "6.11.1"

jobs:
  build-and-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize PATH for Python on Windows
        shell: pwsh
        run: |
          $pathParts = $env:PATH -split ';' | Where-Object {
            $_ -and ($_ -notlike '*\AppData\Local\Microsoft\WindowsApps*')
          }
          "PATH=$($pathParts -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Qt (MinGW)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: "win64_mingw"
          modules: "qtshadertools"
          tools: "tools_mingw1310,qt.tools.win64_mingw1310"
          aqtversion: "==3.3.*"
          py7zrversion: "==1.1.*"
          set-env: "true"

      # Qt 6.11 publishes Qt PDF in the extensions repository rather than the
      # desktop module feed consumed by install-qt-action/aqtinstall.
      - name: Install Qt PDF extension
        shell: pwsh
        run: ./scripts/install_qt_pdf_extension.ps1 -QtRoot $env:QT_ROOT_DIR

      - name: Use Qt bundled MinGW toolchain
        shell: pwsh
        run: |
          if (-not $env:IQTA_TOOLS -or -not (Test-Path $env:IQTA_TOOLS)) {
            throw "IQTA_TOOLS is not set or missing. install-qt-action tools install failed."
          }
          if (-not $env:QT_ROOT_DIR -or -not (Test-Path $env:QT_ROOT_DIR)) {
            throw "QT_ROOT_DIR is not set or missing."
          }

          $mingwDir = Get-ChildItem -Path $env:IQTA_TOOLS -Directory |
            Where-Object { $_.Name -like "mingw*_64" } |
            Sort-Object Name -Descending |
            Select-Object -First 1

          if (-not $mingwDir) {
            throw "No Qt MinGW toolchain found under IQTA_TOOLS=$env:IQTA_TOOLS"
          }

          $mingwBin = Join-Path $mingwDir.FullName "bin"
          if (-not (Test-Path (Join-Path $mingwBin "g++.exe"))) {
            throw "g++.exe not found in $mingwBin"
          }

          $qt6CmakeDir = Join-Path $env:QT_ROOT_DIR "lib\cmake\Qt6"
          if (-not (Test-Path (Join-Path $qt6CmakeDir "Qt6Config.cmake"))) {
            throw "Qt6Config.cmake not found in $qt6CmakeDir"
          }

          "PATH=$mingwBin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC=$mingwBin\gcc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CXX=$mingwBin\g++.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MINGW_MAKE=$mingwBin\mingw32-make.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "QT6_CMAKE_DIR=$qt6CmakeDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify compiler selection
        shell: pwsh
        run: |
          Write-Host "QT_ROOT_DIR=$env:QT_ROOT_DIR"
          Write-Host "IQTA_TOOLS=$env:IQTA_TOOLS"
          Write-Host "CC=$env:CC"
          Write-Host "CXX=$env:CXX"
          Write-Host "MINGW_MAKE=$env:MINGW_MAKE"
          Write-Host "QT6_CMAKE_DIR=$env:QT6_CMAKE_DIR"
          where.exe gcc
          where.exe g++
          & $env:CXX --version

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build-ci -G "MinGW Makefiles"
          -DCMAKE_C_COMPILER:FILEPATH=${{ env.CC }}
          -DCMAKE_CXX_COMPILER:FILEPATH=${{ env.CXX }}
          -DCMAKE_MAKE_PROGRAM:FILEPATH=${{ env.MINGW_MAKE }}
          -DQt6_DIR:PATH=${{ env.QT6_CMAKE_DIR }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DELLA_ENABLE_MEDIA_PLAYBACK=OFF
          -DELLA_LOCAL_WINDEPLOYQT=OFF
          -DELLA_RELEASE_VERSION=1.0.0-rc.ci
          -DELLA_RELEASE_CHANNEL=release-candidate
          -DELLA_BUILD_ID=github-${{ github.run_id }}

      - name: Build
        shell: pwsh
        run: cmake --build build-ci --config ${{ matrix.build_type }} -j 4

      - name: Run tests
        shell: pwsh
        run: ctest --test-dir build-ci --output-on-failure -C ${{ matrix.build_type }}

      - name: Validate malicious component archives
        shell: pwsh
        run: ./scripts/test_component_archives.ps1

      - name: Package lean core and enforce size budgets
        if: matrix.build_type == 'Release'
        shell: pwsh
        run: |
          $mingwBin = Split-Path $env:CXX -Parent
          ./scripts/beta_release.ps1 -Version 1.0.0-rc.ci -BuildDir build-ci -QtRoot $env:QT_ROOT_DIR -MingwBin $mingwBin -SkipBuild -SkipTests

      - name: Upload verified release candidate
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: ella-core-windows
          path: |
            artifacts/ella-win64-1.0.0-rc.ci/*.zip
            artifacts/ella-win64-1.0.0-rc.ci/*.exe
            artifacts/ella-win64-1.0.0-rc.ci/*.json
            artifacts/ella-win64-1.0.0-rc.ci/SHA256SUMS.txt
